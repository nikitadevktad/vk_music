    body='<div class="sheetPerson">'+(recent?img(sheet==='extra'?'album1':'album0','portrait'):portrait(1-role))+'<div><strong>'+name+'</strong><small>'+timestamp+'</small></div></div><div class="trackCard">'+img('album'+n)+'<div><small>VK Микс</small><strong>'+titles[n]+'</strong><small>'+artist+'</small></div></div>';
    if(!recent)body+=btn('join',stage==='duo'?'Вернуться в общий плеер':prefs.allowed[1-role]?'Подключиться к миксу':'Запросить подключение','btn');
    else body+=btn('listenSingle','Послушать трек','btn');
  }
  if((sheet==='friend'||sheet==='hiddenFriend') && prefs.allowed[role]) body+=btn('revoke','Отозвать доступ к моему миксу','revoke');
  return '<div class="sheetbg"><section class="sheet" role="dialog" aria-modal="true" tabindex="-1" aria-label="Музыкальная активность"><div class="handle"></div><button class="dismiss" data-a="close" aria-label="Закрыть">×</button>'+body+'</section></div>';
}
let returnAction='';
function closeSheet(){
  const layer=document.querySelector('.sheetbg');if(!layer)return;
  if(layer.classList.contains('leaving'))return;
  layer.classList.add('leaving');

function sound(){if(!ctx)ctx=new AudioContext();if(ctx.state==='suspended')ctx.resume().catch(()=>{})}
function tick(){const c=clock(),t=elapsed(c);let p=document.querySelector('#pos'),s=document.querySelector('#seek');if(p)p.textContent=fmt(t);if(s&&document.activeElement!==s)s.value=t;let b=Math.floor(t*2);if(ctx&&c.run&&b!==beat&&(mini[role]||page[role]==='player')){beat=b;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=[220,261.63,329.63,392][(b+c.n)%4];g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.07,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.26);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.28)}}
function joinMix(host) {
  if(stage!=='duo'){const h=clocks[host];clocks[1]=makeClock(h.n,elapsed(h));clocks[1].run=true;}
  stage='duo';page=['player','player'];mini=[true,true];sheet='';sound();
}
function act(a){
  let c=clock(),keep=false;
  if(a==='reset') reset();
  if(['lena','anya','switch','receiver'].includes(a)){
    role=a==='switch'?1-role:a==='receiver'?1-requester:a==='lena'?0:1;
    sheet=stage==='pending'?(role===requester?'await':'permission'):'';
  }
  if(['friend','hiddenFriend','recent','extra','friends','settings','close'].includes(a)){sheet=a==='close'?'':a;keep=true}
  if(a==='revoke'){prefs.allowed[role]=false;savePrefs();sheet='';keep=true}
  if(a==='addFriend'){prefs.added[role]=true;savePrefs();sheet='';keep=true}
  if(a==='back'){page[role]=page[role]==='privacy'?'profile':'home';sheet=''}
  if(['home','privacy','profile','player'].includes(a))page[role]=a;
  if(a==='join'){
    if(stage==='pending')sheet=role===requester?'await':'permission';
    else if(stage==='duo'||(privacy[1-role]&&prefs.allowed[1-role]))joinMix(1-role);
    else{requester=role;stage='pending';sheet='await'}
  }
  if(a==='allow' && role!==requester && stage==='pending'){prefs.allowed[role]=true;savePrefs();joinMix(role)}
  if(a==='deny'||a==='cancel'){stage='solo';role=requester;sheet=a==='deny'?'denied':''}

if(a==='mix'||a==='local'){if(a==='local'&&stage!=='duo')clocks[role]=makeClock(clocks[1-role].n,0);clock().run=true;clock().at=performance.now();page[role]='player';sheet='';mini[role]=true;sound()}if(a==='play'){c.t=elapsed(c);c.at=performance.now();c.run=!c.run;sound()}if(a==='prev'||a==='next'){c.n=(c.n+(a==='next'?1:2))%3;c.t=0;c.at=performance.now();sound()}if(a==='leave'){let t=elapsed(c);clocks=[makeClock(c.n,t),makeClock(c.n,t)];clocks[1-role].run=c.run;clocks[role].run=false;stage='solo';page[role]='home'}render(keep)}
