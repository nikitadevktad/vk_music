const makeClock=(n,t)=>({n,t,at:performance.now(),run:true});let clocks,role,page,stage,sheet,privacy,returnPage,ctx,heard='',beat=-1,mini;
function reset(){clocks=[makeClock(1,0),makeClock(0,42)];clocks[0].run=false;role=0;page=['home','home'];stage='solo';sheet='';privacy=[false,true];returnPage=['home','home'];mini=[false,false]}reset();
const who=()=>role?'Аня':'Лена',peer=()=>role?'Лена':'Аня',clock=()=>clocks[stage==='duo'?1:role],elapsed=c=>(c.t+(c.run?(performance.now()-c.at)/1000:0))%180,fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const img=(k,c='')=>'<img alt="" class="'+c+'" src="'+A[k]+'">',btn=(a,s,c='')=>'<button data-a="'+a+'" class="'+c+'">'+s+'</button>',status=()=>'<div class="status"><span>17:54</span><span>▮▮▮ ◒ ▰</span></div>',pageHeader=t=>'<div class="top">'+btn('back','‹','back')+t+'<span></span></div>',face=i=>i?'<span class="face">А</span>':img('avatar','ava');
function home(){return '<div class="hero" style="background-image:url('+A.wave+')">'+status()+'<div class="toolbar">'+btn('profile',face(role)+' '+who()+' ›','line')+'<span aria-hidden="true">⌕　♫</span></div><div class="heroMain">'+btn('mix','▶','play')+'<h1>Слушать VK Микс</h1><p>Музыкальные рекомендации для вас</p>'+btn('settings','⚙ Настроить','tune')+'</div></div><div class="body">'+img('banner','banner')+'<div class="tiles">'+['Мои треки','Недавнее','Face','Сборник аудиосказок'].map((t,i)=>'<div>'+img('album'+i)+t+(i===0?'<br><small>989 всего</small>':'')+'</div>').join('')+'</div>'+(stage==='pending'?btn('chat',role?'Лена хочет слушать вместе · Открыть':'Запрос отправлен · Открыть чат','btn secondary'):'')+(privacy[1-role]?'<h2>Сейчас слушают друзья</h2>'+btn('friend',face(1-role)+'<div><strong>'+peer()+'</strong><br><small><span class="eq">▥</span> '+titles[clocks[1-role].n]+' · '+artist+'</small></div>'+img('album'+clocks[1-role].n),'friend'):'')+'<h2>Собрано алгоритмами</h2><div class="row">'+img('discover','disc')+img('new','disc')+'</div></div>'}
function profile(){return status()+pageHeader('Профиль')+'<div class="profile">'+face(role)+'<h2>'+who()+'</h2><button data-a="switch">Сменить аккаунт</button></div><div class="page">'+['Настройки приложения','Настройки рекомендаций','Перенос из других сервисов','Приватность музыки','Управление подпиской','Помощь','О приложении'].map((s,i)=>i===3?btn('privacy','<b>♡</b>'+s+'<span>›</span>','item'):'<div class="item"><b>'+['⚙','♡','⇩','','♧','◎','ⓘ'][i]+'</b>'+s+'<span>›</span></div>').join('')+'</div>'}
function player(){let c=clock();return status()+pageHeader('VK Микс')+'<div class="player">'+img('album'+c.n,'cover')+'<h2>'+titles[c.n]+'</h2><div class="muted">'+artist+'</div><input id="seek" aria-label="Позиция трека" type="range" min="0" max="179" value="'+Math.floor(elapsed(c))+'"><div class="clock"><span id="pos"></span><span>3:00</span></div><div class="ctrl">'+btn('prev','◀◀')+btn('play',c.run?'Ⅱ':'▶','big')+btn('next','▶▶')+'</div>'+(stage==='duo'?'<p class="eq">● Лена и Аня слушают вместе</p>'+btn('leave','Выйти из сеанса','btn secondary'):btn('home','На главную','btn secondary'))+'</div>'}
function chat(){return status()+pageHeader('Диалог · '+peer())+'<div class="page"><div class="chatcard"><strong>Слушать вместе</strong><p>'+({pending:'Лена хочет подключиться к VK Миксу Ани.',duo:'Лена и Аня слушают один трек.',declined:'Приглашение отклонено.',solo:'Сейчас нет активного приглашения.'}[stage])+'</p>'+(stage==='pending'?(role?btn('accept','Принять','btn')+btn('decline','Отклонить','btn secondary'):btn('receiver','Посмотреть за Аню','btn')+btn('cancel','Отменить запрос','btn secondary')):stage==='duo'?btn('player','Открыть плеер','btn'):btn('home','На главную','btn secondary'))+'</div></div>'}
function panel(){if(!sheet)return '';let f=clocks[1-role];return '<div class="sheetbg"><section class="sheet" role="dialog" aria-label="Действия"><div class="handle"></div>'+btn('close','Закрыть','end')+(sheet==='friend'?'<h2>'+peer()+' слушает VK Микс</h2><div class="song">'+img('album'+f.n)+'<div><strong>'+titles[f.n]+'</strong><br>'+artist+'</div>'+btn('local','▶','end')+'</div><small>После принятия запроса вы продолжите с одного момента.</small>'+btn(role?'switch':'request',role?'Перейти к сценарию Лены':'Слушать с Аней','btn'): '<h2>Настройки VK Микса</h2><p>Для вас · Все жанры</p>'+btn('mix','Слушать микс','btn'))+'</section></div>'}
function render(keep=false){const y=keep?document.querySelector('.scroll')?.scrollTop||0:0;document.querySelectorAll('.demo button').forEach(b=>b.classList.toggle('active',b.dataset.a===['lena','anya'][role]));let p=page[role],c=clock();app.innerHTML='<div class="scroll">'+(p==='home'?home():p==='profile'?profile():p==='chat'?chat():p==='privacy'?status()+pageHeader('Приватность музыки')+'<div class="page"><label class="item">Показывать друзьям, что я слушаю<input class="toggle" type="checkbox" id="privacy" '+(privacy[role]?'checked':'')+'></label></div>':player())+'</div>'+(mini[role]&&p!=='player'?btn('player',img('album'+c.n)+'<strong>'+titles[c.n]+'</strong><span class="end">Открыть плеер</span>','mini'):'')+'<img alt="Главная, Обзор, Книги и шоу, Детям, Моя музыка" class="nav" src="'+A.nav+'">'+panel();document.querySelector('.scroll').scrollTop=y;tick()}
function sound(){if(!ctx)ctx=new AudioContext();if(ctx.state==='suspended')ctx.resume().catch(()=>{})}
function tick(){const c=clock(),t=elapsed(c);let p=document.querySelector('#pos'),s=document.querySelector('#seek');if(p)p.textContent=fmt(t);if(s&&document.activeElement!==s)s.value=t;let b=Math.floor(t*2);if(ctx&&c.run&&b!==beat&&(mini[role]||page[role]==='player')){beat=b;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=[220,261.63,329.63,392][(b+c.n)%4];g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.07,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.26);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.28)}}
function act(a){let c=clock(),keep=false;if(a==='reset')reset();if(['lena','anya','switch','receiver'].includes(a)){role=a==='switch'?1-role:a==='lena'?0:1;sheet='';if(a==='receiver'||stage==='pending')page[role]='chat'}if(a==='close'||a==='friend'||a==='settings'){sheet=a==='close'?'':a;keep=true}if(a==='back'){page[role]=page[role]==='privacy'?'profile':'home';sheet=''}if(['home','privacy','profile','chat','player'].includes(a))page[role]=a;if(a==='request'){stage='pending';sheet='';page[0]='chat'}if(a==='cancel'||a==='decline'){stage=a==='decline'?'declined':'solo'}if(a==='accept'){stage='duo';page=['player','player'];mini=[true,true];sound()}if(a==='mix'||a==='local'){if(a==='local'&&stage!=='duo')clocks[role]=makeClock(clocks[1-role].n,0);clock().run=true;clock().at=performance.now();page[role]='player';sheet='';mini[role]=true;sound()}if(a==='play'){c.t=elapsed(c);c.at=performance.now();c.run=!c.run;sound()}if(a==='prev'||a==='next'){c.n=(c.n+(a==='next'?1:2))%3;c.t=0;c.at=performance.now();sound()}if(a==='leave'){let t=elapsed(c);clocks=[makeClock(c.n,t),makeClock(c.n,t)];clocks[1-role].run=c.run;clocks[role].run=false;stage='solo';page[role]='home'}render(keep)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a)act(a);else if(e.target.className==='sheetbg')act('close')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)act('close')});document.addEventListener('change',e=>{if(e.target.id==='privacy')privacy[role]=e.target.checked;if(e.target.id==='seek'){let c=clock();c.t=+e.target.value;c.at=performance.now()}});reset();render();setInterval(tick,160);
